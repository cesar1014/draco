<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Página local e fechada: nada de rede, só o estilo e o script daqui de dentro. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #313338;
        color: #dbdee1;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        color: #f2f3f5;
      }
      p {
        margin: 0 0 10px;
        font-size: 14px;
        line-height: 1.5;
        color: #b5bac1;
      }
      code {
        font-size: 12px;
        color: #949ba4;
        word-break: break-all;
      }
      button {
        margin-top: 18px;
        padding: 10px 22px;
        border: 0;
        border-radius: 4px;
        background: #5b6cff;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #4752c4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Não deu para abrir o app</h1>
      <p>
        O servidor não respondeu. Costuma ser internet caindo — ou o serviço gratuito acordando
        depois de ficar parado, o que leva uns 30 segundos na primeira vez.
      </p>
      <p id="detail"></p>
      <p><code id="target"></code></p>
      <button type="button" id="retry">Tentar de novo</button>
    </div>

    <script>
      // A URL e o motivo vêm por query porque esta página é local: ela não tem
      // como saber o endereço do app nem o erro do Chromium por conta própria.
      const params = new URLSearchParams(location.search);
      const url = params.get("url") ?? "";
      const message = params.get("message");

      document.getElementById("target").textContent = url;
      if (message) document.getElementById("detail").textContent = "Detalhe técnico: " + message;

      document.getElementById("retry").addEventListener("click", () => {
        if (url) location.href = url;
      });
    </script>
  </body>
</html>
